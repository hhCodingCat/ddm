name: Build ImmortalWrt fchomo Package for RAX3000M

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget

    - name: Download ImmortalWrt SDK
      run: |
        wget https://downloads.immortalwrt.org/releases/23.05.0/targets/mediatek/filogic/immortalwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        tar -xJf immortalwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64.tar.xz
        mv immortalwrt-sdk-23.05.0-mediatek-filogic_gcc-12.3.0_musl.Linux-x86_64 sdk

    - name: Update and install feeds
      run: |
        cd sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Clone fchomo package
      run: |
        cd sdk/package
        git clone --depth 1 --branch master https://github.com/fcshark-org/openwrt-fchomo.git openwrt-fchomo
        cd openwrt-fchomo
        git checkout

    - name: Configure package
      run: |
        cd sdk
        echo "CONFIG_PACKAGE_luci-app-fchomo=y" >> .config
        make defconfig

    - name: Compile package
      run: |
        cd sdk
        make package/luci-app-fchomo/compile V=s -j$(nproc)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: fchomo-ipk
        path: sdk/bin/packages/aarch64_cortex-a53/*/luci-app-fchomo_*.ipk
