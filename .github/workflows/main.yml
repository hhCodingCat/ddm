name: Config Update

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: "Setup sing-box"
      env:
        SING_BOX_DEB_URL: "https://github.com/SagerNet/sing-box/releases/download/v1.12.9/sing-box_1.12.9_amd64.deb"  # 更新到最新稳定版
      run: |
          set -Eeuo pipefail
          wget -O sing-box.deb $SING_BOX_DEB_URL
          sudo dpkg -i sing-box.deb

    - name: Set up Python3
      uses: actions/setup-python@v2
      with:
        python-version: 3.x

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests pyyaml

    - name: Create output directories
      run: |
        mkdir -p ./data/rule_json ./data/rule_srs

    - name: Run script
      run: python convert.py  # 移除 ../，因为 working-directory 是 ./data/，source.txt 在根目录需调整路径或移动
      working-directory: ./data/
      env:
        SOURCE_PATH: "../source.txt"  # 如果需调整源文件路径

    - name: Move files to rule_json and rule_srs
      run: |
        mv ./data/*.json ./data/rule_json/ 2>/dev/null || true
        mv ./data/*.srs ./data/rule_srs/ 2>/dev/null || true

    - name: Commit and push
      run: |
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        git add ./data/rule_json/*.json ./data/rule_srs/*.srs

        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        else
          git commit -m "Update rules"
          git push
        fi
