;Custom_OpenClash_Rules
;大陆白名单模式，无污染，无泄漏，降低延迟提升响应速度！
;基于 ACL4SSR 模板优化，感谢原作者！
;新增：oracle.com, 061024.xyz, cloudflare-cn.com, cloudflare.com 直连规则
;新增：🤖 AI服务组，包含 grok.com, openai.com, bing.com 等
;新增：节点地区分组（美国、香港、新加坡、日本、台湾、韩国、其他地区）
;新增：故障转移（failover）和负载均衡（load-balance）策略
;优化：支持 OpenClash Smart 策略组内核，添加 policy-priority 节点权重
;图标美化：全局使用直观 emoji，⛔️ 替换为 🎯 全球直连
;项目参考：https://github.com/ACL4SSR/ACL4SSR
;问题反馈：Telegram 群组 https://t.me/custom_openclash_rules_group
;更新通知：Telegram 频道 https://t.me/custom_openclash_rules

[custom]
;--- 规则部分 ---
;规则按从上到下优先级匹配，优先命中上位规则
;本地网络和私有地址直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list,28800
;自定义直连域名（可在此添加或删除域名，格式：DOMAIN-SUFFIX,域名）
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,oracle.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,061024.xyz
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cloudflare-cn.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cloudflare.com
;Windows 时间同步和通知服务直连
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,time.windows.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,client.wns.windows.com
;国内域名和 IP 直连
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list,28800
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list,28800
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,28800
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list,28800
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list,28800
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
;AI 服务（Grok, ChatGPT, Copilot 等）
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,bing.com
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,chatgpt
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,copilot
;Telegram
ruleset=💬 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list,28800
;微软服务
ruleset=🖥️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list,28800
;苹果服务
ruleset=🍏 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list,28800
;谷歌服务
ruleset=🇬 谷歌服务,[]DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list,28800
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list,28800
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list,28800
ruleset=🇬 谷歌服务,[]DOMAIN-KEYWORD,google
;Netflix
ruleset=🎥 Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list,28800
;海外媒体
ruleset=🌎 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list,28800
;未匹配流量走代理
ruleset=🚀 节点选择,[]FINAL

;--- 节点分组部分 ---
;节点分组支持 Smart 策略组、failover、load-balance、manual select 和地区分组
;policy-priority 配置：高权重节点优先，需替换为实际节点名称和权重
;地区权重示例：香港(100), 美国(90), 新加坡(80), 日本(70), 台湾(60), 韩国(50), 其他(40)
;具体节点示例：policy-priority=香港节点 1:100,香港节点 2:80,美国节点 1:90,美国节点 2:70
policy-priority=示例节点 1:100,示例节点 2:80,示例节点 3:60
custom_proxy_group=🚀 节点选择`select`[]♻️ 智能选择`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🇹🇼 台湾节点`[]🇰🇷 韩国节点`[]🌐 其他地区`[]🎯 全球直连
custom_proxy_group=♻️ 智能选择`smart`.*`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🤖 AI服务`failover`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]♻️ 智能选择`[]🎯 全球直连`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇬 谷歌服务`failover`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]♻️ 智能选择`[]🎯 全球直连`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🌎 国外媒体`load-balance:consistent-hashing`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]♻️ 智能选择`[]🎯 全球直连`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🎥 Netflix`failover`[]🇺🇸 美国节点`[]🇸🇬 新加坡节点`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]♻️ 智能选择`[]🎯 全球直连`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=💬 Telegram`load-balance:consistent-hashing`[]🇺🇸 美国节点`[]🇭🇰 香港节点`[]🇸🇬 新加坡节点`[]🇯🇵 日本节点`[]🚀 节点选择`[]♻️ 智能选择`[]🎯 全球直连`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🖥️ 微软服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 智能选择`[]🇺🇸 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🍏 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择`[]♻️ 智能选择`[]🇺🇸 美国节点`[]🇭🇰 香港节点
custom_proxy_group=🇺🇸 美国节点`smart`(美|US|United States)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇭🇰 香港节点`smart`(港|HK|Hong Kong)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇸🇬 新加坡节点`smart`(新加坡|SG|Singapore)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇯🇵 日本节点`smart`(日本|JP|Japan)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇹🇼 台湾节点`smart`(台|TW|Taiwan)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🇰🇷 韩国节点`smart`(韩|KR|Korea)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🌐 其他地区`smart`(^(?!.*(美|US|United States|港|HK|Hong Kong|新加坡|SG|Singapore|日本|JP|Japan|台|TW|Taiwan|韩|KR|Korea)).*)`http://www.gstatic.com/generate_204`600,,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT

;--- 参数设置 ---
enable_rule_generator=true
overwrite_original_rules=true
