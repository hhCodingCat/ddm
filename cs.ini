; Custom_OpenClash_Rules - 大陆白名单优化版
; 版本: v2.1.1
; 特点: 无污染、无泄漏、低延迟、高响应
; 基于 ACL4SSR 深度优化 | 最后更新: 2023-11-15

[custom]
; === 规则部分 ===
; 规则匹配优先级: 从上至下 | 缓存时间: 86400秒(24小时)

; 1. 基础网络规则
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list,86400
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list,86400

; 2. 自定义直连域名 (优化格式)
ruleset=🎯 全球直连,DOMAIN-SUFFIX,oracle.com
ruleset=🎯 全球直连,DOMAIN-SUFFIX,061024.xyz
ruleset=🎯 全球直连,DOMAIN-SUFFIX,cloudflare-cn.com
ruleset=🎯 全球直连,DOMAIN-SUFFIX,cloudflare.com
ruleset=🎯 全球直连,DOMAIN-SUFFIX,time.windows.com
ruleset=🎯 全球直连,DOMAIN-SUFFIX,client.wns.windows.com

; 3. 中国大陆资源 (合并同类规则)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list,86400
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list,86400
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list,86400
ruleset=🎯 全球直连,GEOIP,CN,no-resolve

; 4. 流媒体服务 (优化分组逻辑)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list,86400
ruleset=🎥 Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list,86400
ruleset=📺 海外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list,86400

; 5. AI服务 (增强覆盖范围)
ruleset=🤖 AI服务,DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI服务,DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI服务,DOMAIN-SUFFIX,anthropic.com
ruleset=🤖 AI服务,DOMAIN-SUFFIX,bing.com
ruleset=🤖 AI服务,DOMAIN-SUFFIX,poe.com
ruleset=🤖 AI服务,DOMAIN-KEYWORD,chatgpt
ruleset=🤖 AI服务,DOMAIN-KEYWORD,copilot
ruleset=🤖 AI服务,DOMAIN-KEYWORD,gemini

; 6. 国际服务 (优化规则顺序)
ruleset=📡 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list,86400
ruleset=💻 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list,86400
ruleset=🍏 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list,86400
ruleset=🌍 谷歌服务,DOMAIN-SUFFIX,services.googleapis.cn
ruleset=🌍 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list,86400
ruleset=🌍 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list,86400
ruleset=🌍 谷歌服务,DOMAIN-KEYWORD,google

; 7. 最终规则
ruleset=🚀 节点选择,FINAL

; === 节点分组 ===
; 策略组类型: select=手动选择 | url-test=自动测速 | fallback=故障转移

custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🎯 全球直连
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,100,50
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 服务专用组 (优化故障转移策略)
custom_proxy_group=🤖 AI服务`fallback`.*`http://www.gstatic.com/generate_204`300,100,50
custom_proxy_group=🌍 谷歌服务`fallback`.*`http://www.gstatic.com/generate_204`300,100,50
custom_proxy_group=📺 海外媒体`fallback`.*`http://www.gstatic.com/generate_204`300,100,50
custom_proxy_group=🎥 Netflix`fallback`.*`http://www.gstatic.com/generate_204`300,100,50
custom_proxy_group=📡 Telegram`fallback`.*`http://www.gstatic.com/generate_204`300,100,50

; 企业服务组 (优化选择策略)
custom_proxy_group=💻 微软服务`select`[]🎯 全球直连`[]🚀 节点选择
custom_proxy_group=🍏 苹果服务`select`[]🎯 全球直连`[]🚀 节点选择

; === 高级设置 ===
enable_rule_generator=true
overwrite_original_rules=true
rule_update_interval=86400
enable_tcp_concurrent=true
