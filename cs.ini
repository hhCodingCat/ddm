# Clash 配置文件：大陆白名单模式
# 目标：无污染、无泄漏、低延迟、高吞吐量、稳定可靠
# 功能：
# - 国内流量走直连（白名单模式），国外流量走代理
# - 支持负载均衡（分摊流量）、自动选择（低延迟节点）、故障转移（高可用性）
# - 优化谷歌、AI、奈飞、电报等服务，降低延迟，提升响应速度
# - 精简规则，减少匹配开销，确保高效性
# 使用说明：
# 1. 确保节点列表包含多个高质量节点（低延迟、高带宽）
# 2. 定期更新外部规则文件（如 ChinaDomain.list、Netflix.list）
# 3. 启用 Clash 日志，监控流量路由和节点性能
# 4. 可按需调整测试 URL、间隔和延迟阈值

# 设置规则标志位
# 说明：规则按优先级排列，高频服务靠前，国内直连规则靠后，兜底走代理
# - 📢 谷歌服务：覆盖谷歌相关域名和 YouTube、FCM 等服务
# - 🤖 AI服务：支持 OpenAI、ChatGPT、Anthropic、Grok 等 AI 平台
# - 📲 电报信息：Telegram 相关域名和 IP
# - 🎥 奈飞视频：Netflix 流媒体服务
# - 🌍 国外媒体：国外流媒体和社交平台
# - Ⓜ️ 微软服务：Microsoft 服务（如 OneDrive、Windows Update）
# - 🍎 苹果服务：Apple 服务（如 App Store、iCloud）
# - 🌐 国内直连：国内域名、IP 和常见服务，直连以降低延迟
# - 🚀 节点选择：兜底规则，未匹配流量走代理
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,services.googleapis.cn,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,googleapis.com,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,youtube.com,no-resolve
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,openai.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,chatgpt.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,anthropic.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,api.grok.ai,no-resolve
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🎥 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
ruleset=🌐 国内直连,[]DOMAIN-SUFFIX,time.windows.com,no-resolve
ruleset=🌐 国内直连,[]DOMAIN-SUFFIX,client.wns.windows.com,no-resolve
ruleset=🌐 国内直连,[]DOMAIN-SUFFIX,oracle.com,no-resolve
ruleset=🌐 国内直连,[]DOMAIN-SUFFIX,cloudflare-cn.com,no-resolve
ruleset=🌐 国内直连,[]DOMAIN-SUFFIX,cloudflare.com,no-resolve
ruleset=🌐 全球直连,[]DOMAIN-SUFFIX,061024.xyz,no-resolve
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🌐 国内直连,[]GEOIP,CN,no-resolve
ruleset=🚀 节点选择,[]FINAL

# 设置分组标志位
# 说明：分组定义了流量路由策略，支持手动选择、负载均衡、自动选择和故障转移
# - 🚀 节点选择：主分组，用户可手动选择负载均衡、自动选择、故障转移或直连
# - ⚖️ 负载均衡：均匀分配流量到多个节点，适合高流量场景（如奈飞、YouTube）
# - ♻️ 自动选择：根据延迟测试选择最优节点，适合低延迟需求
# - 🔄 故障转移：当主节点不可用时自动切换，保障高可用性
# - 🌐 国内直连：国内流量直连，降低延迟
# 测试参数：
# - URL: http://cp.cloudflare.com（可靠的全球测试地址）
# - 间隔：200秒（频繁检测节点状态）
# - 延迟阈值：30ms（选择低延迟节点）
custom_proxy_group=🚀 节点选择`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://cp.cloudflare.com`200,,30
custom_proxy_group=♻️ 自动选择`url-test`.*`http://cp.cloudflare.com`200,,30
custom_proxy_group=🔄 故障转移`fallback`.*`http://cp.cloudflare.com`200,,30
custom_proxy_group=📢 谷歌服务`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=🌍 国外媒体`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=🎥 奈飞视频`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=📲 电报信息`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=🍎 苹果服务`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=🤖 AI服务`select`[]⚖️ 负载均衡`[]♻️ 自动选择`[]🔄 故障转移`[]🌐 国内直连`.*
custom_proxy_group=🌐 国内直连`select`[]DIRECT

# 规则生成器设置
# 说明：启用规则生成器，覆盖原始规则，确保配置一致性
enable_rule_generator=true
overwrite_original_rules=true

# 优化建议
# 1. 节点管理：确保节点列表包含低延迟、高带宽节点，可按区域（如 Asia、US）分组
# 2. 规则更新：定期检查外部规则文件，使用 GitHub 主分支或稳定版本
# 3. 性能监控：启用 Clash 日志，检查流量路由和节点延迟，剔除不稳定节点
# 4. DNS 配置：建议启用 fake-ip 模式，使用可靠 DNS（如 8.8.8.8、1.1.1.1）防止污染
# 5. 高流量场景：奈飞、YouTube 可优先使用负载均衡，AI服务可指定低延迟节点
# 6. 区域优化：可为负载均衡添加区域过滤（如 Asia.*），提升地理相关性
