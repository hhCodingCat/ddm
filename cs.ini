;Custom_OpenClash_Rules - 优化版
;大陆白名单模式，无污染，无泄漏，降低延迟提升响应速度！
;基于 ACL4SSR 模板优化，感谢原作者！
;目标：优先匹配直连，未匹配流量强制走代理，提高自动化程度。

[custom]
;--- 规则部分 ---
;规则按从上到下优先级匹配，优先命中上位规则

; 1. 强制直连规则 (本地、私有、中国大陆、系统服务、自定义直连)
; 本地网络和私有地址直连 (最高优先级)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list

; 自定义强制直连域名 (例如：你不希望被任何代理规则捕获的特定域名)
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,oracle.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,061024.xyz
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cloudflare-cn.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,cloudflare.com

; Windows 时间同步和通知服务直连 (确保系统正常工作)
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,time.windows.com
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,client.wns.windows.com

; 部分 Google 中国服务 (例如地图、字体、验证码等在中国大陆有节点的)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,services.googleapis.cn ; 明确列出这个CN域

; 国内域名和 IP 直连 (大陆白名单核心)
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list ; 曾被屏蔽但已解除的域名
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve ; 大陆IP直连

; 2. 需要代理的特定服务规则 (指向对应的代理组)
; AI 服务 (Grok, ChatGPT, Copilot 等)
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,grok.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,openai.com
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,bing.com
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,chatgpt
ruleset=🤖 AI服务,[]DOMAIN-KEYWORD,copilot

; Telegram
ruleset=💬 Telegram,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

; 微软服务 (不强制手动选择，走通用代理或特定微软代理组)
; 如果需要为微软创建特定代理组，在这里添加规则并指向该组
; 例如：ruleset=🖥️ 微软代理组,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list
; 这里我们不添加特定规则，让微软流量走最终代理规则，除非有明确的直连需求（已在上面处理）

; 苹果服务 (不强制手动选择，走通用代理或特定苹果代理组)
; 如果需要为苹果创建特定代理组，在这里添加规则并指向该组
; 例如：ruleset=🍏 苹果代理组,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list
; 这里我们不添加特定规则，让苹果流量走最终代理规则，除非有明确的直连需求

; Google 服务 (非CN部分，需要代理)
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list
ruleset=🇬 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/YouTube.list
ruleset=🇬 谷歌服务,[]DOMAIN-KEYWORD,google ; 通用的 Google 关键词

; Netflix
ruleset=🎥 Netflix,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list

; 海外媒体 (如 Facebook, Twitter, Instagram 等)
ruleset=🌎 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

; 3. 未匹配流量处理 (强制走代理)
; 所有未被上述规则匹配的流量，全部通过主节点选择组进行代理
ruleset=🚀 节点选择,[]FINAL

;--- 节点分组部分 ---
; 优化 fallback 链条，移除不必要的 select 组

; 主节点选择组：用户手动选择代理节点或触发自动选择
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`.*` ; .* 包含了所有可用节点，包括 DIRECT

; 自动选择组：对代理节点进行 URL 测试以选出最佳节点
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`600,,50 ; .* 包含了所有可用代理节点

; 强制直连组：只包含 DIRECT
custom_proxy_group=🎯 全球直连`select`[]DIRECT

; 特定服务代理组：使用 fallback，当优选节点（自动选择）不可用时，回退到主选择组
; 这样可以利用主选择组的自动测试或手动选择功能
custom_proxy_group=🤖 AI服务`fallback`[]♻️ 自动选择`[]🚀 节点选择`
custom_proxy_group=🇬 谷歌服务`fallback`[]♻️ 自动选择`[]🚀 节点选择`
custom_proxy_group=🌎 国外媒体`fallback`[]♻️ 自动选择`[]🚀 节点选择`
custom_proxy_group=🎥 Netflix`fallback`[]♻️ 自动选择`[]🚀 节点选择`
custom_proxy_group=💬 Telegram`fallback`[]♻️ 自动选择`[]🚀 节点选择`

; 移除原有的 🖥️ 微软服务 和 🍏 苹果服务 select 组，因为规则已经不强制指向它们了

;--- 参数设置 ---
enable_rule_generator=true
overwrite_original_rules=true
