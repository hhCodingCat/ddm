# Nikki / Mihomo 可用 - 大陆白名单模式（精简优化版）
# 使用方法：
# 1. 把下面内容放到你的 profile（或 Nikki 混入配置）中
# 2. 确保已有节点（proxies），策略组会自动匹配
# 3. 保存并更新配置即可

proxy-groups:
  # 核心通用
  - name: 🚀 节点选择
    type: select
    proxies:
      - ♻️ 自动选择
      - 🔄 故障转移
      - ⚖️ 负载均衡
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇰🇷 韩国自动
      - 🇺🇸 美国自动
      - 🇸🇬 新加坡自动
      - 🇹🇼 台湾自动
      - DIRECT

  - name: ♻️ 自动选择
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    proxies: &all-proxies
      - 香港节点示例   # 这里会被实际节点替换，或使用 FILTER / REGEX
      # 实际使用时建议改成：
      # proxies: [] 然后用 filter 或让 subconverter / Nikki 自动填充

  - name: 🔄 故障转移
    type: fallback
    url: http://www.apple.com/library/test/success.html
    interval: 300
    proxies: *all-proxies

  - name: ⚖️ 负载均衡
    type: load-balance
    url: http://www.apple.com/library/test/success.html
    interval: 300
    strategy: consistent-hashing
    proxies: *all-proxies

  # 地区自动
  - name: 🇭🇰 香港自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)港|HK|Hong.?Kong|HKG"

  - name: 🇯🇵 日本自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)日|JP|Japan|Tokyo|NRT"

  - name: 🇰🇷 韩国自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)韩|南韩|KR|Korea|Seoul|ICN"

  - name: 🇺🇸 美国自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)美|US|United.?States|America|LAX|SFO"

  - name: 🇸🇬 新加坡自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)新|坡|SG|Singapore|SIN"

  - name: 🇹🇼 台湾自动
    type: url-test
    url: http://www.apple.com/library/test/success.html
    interval: 300
    tolerance: 50
    filter: "(?i)台|TW|Taiwan|Taipei|TPE"

  # 业务分流
  - name: 🤖 AI服务
    type: select
    proxies:
      - 🚀 节点选择
      - 🇺🇸 美国自动
      - 🇯🇵 日本自动
      - 🇸🇬 新加坡自动
      - 🇹🇼 台湾自动
      - 🇭🇰 香港自动
      - DIRECT

  - name: 🎥 奈飞视频
    type: select
    proxies:
      - 🚀 节点选择
      - 🇺🇸 美国自动
      - 🇭🇰 香港自动
      - 🇹🇼 台湾自动
      - DIRECT

  - name: 📢 谷歌服务
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇺🇸 美国自动
      - DIRECT

  - name: 🌍 国外媒体
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港自动
      - 🇯🇵 日本自动
      - 🇺🇸 美国自动
      - DIRECT

  - name: 📲 电报信息
    type: select
    proxies:
      - 🚀 节点选择
      - ♻️ 自动选择
      - 🇭🇰 香港自动
      - 🇸🇬 新加坡自动
      - DIRECT

  - name: Ⓜ️ 微软服务
    type: select
    proxies:
      - 🌐 国内直连
      - 🚀 节点选择
      - DIRECT

  - name: 🍎 苹果服务
    type: select
    proxies:
      - 🌐 国内直连
      - 🚀 节点选择
      - DIRECT

  - name: 🌐 国内直连
    type: select
    proxies:
      - DIRECT

