# 大陆白名单模式：无污染、无泄漏、低延迟、高吞吐量、稳定可靠
# 优化版：精简 + 补全（2026最新常见需求）

# ==================== 设置规则标志位 ====================

# 📢 谷歌服务（已补全核心 + 使用官方规则）
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,googleapis.com,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,googleusercontent.com,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,gstatic.com,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,youtube.com,no-resolve
ruleset=📢 谷歌服务,[]DOMAIN-SUFFIX,ytimg.com,no-resolve
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=📢 谷歌服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/GoogleFCM.list

# 🤖 AI服务（全面补全主流 + 新兴）
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,openai.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,chatgpt.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,oaistatic.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,oaiusercontent.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,anthropic.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,claude.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,api.grok.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,grok.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,grok.x.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,x.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,perplexity.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,deepl.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,midjourney.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,suno.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,suno.ai,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,githubcopilot.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,gemini.google.com,no-resolve
ruleset=🤖 AI服务,[]DOMAIN-SUFFIX,cdn.oaistatic.com,no-resolve

# 📲 电报信息（已补全常用）
ruleset=📲 电报信息,[]DOMAIN-SUFFIX,t.me,no-resolve
ruleset=📲 电报信息,[]DOMAIN-SUFFIX,tdesktop.com,no-resolve
ruleset=📲 电报信息,[]DOMAIN-SUFFIX,telegram.org,no-resolve
ruleset=📲 电报信息,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list

# 🎥 奈飞视频
ruleset=🎥 奈飞视频,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/Netflix.list

# 🌍 国外媒体 & 常用国外服务（精简合并）
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,github.com,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,githubassets.com,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,githubusercontent.com,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,wikipedia.org,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,twitter.com,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,x.com,no-resolve
ruleset=🌍 国外媒体,[]DOMAIN-SUFFIX,reddit.com,no-resolve
ruleset=🌍 国外媒体,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list

# Ⓜ️ 微软服务
ruleset=Ⓜ️ 微软服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Microsoft.list

# 🍎 苹果服务（国内直连优先，少量必要走代理）
ruleset=🍎 苹果服务,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Apple.list

# 🌐 国内直连（核心白名单）
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/CustomDirect.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaMedia.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaIp.list
ruleset=🌐 国内直连,https://raw.githubusercontent.com/hhCodingCat/ddm/refs/heads/main/CustomDirect.list
ruleset=🌐 国内直连,[]GEOIP,CN,no-resolve

# 兜底（所有未命中走节点选择）
ruleset=🚀 节点选择,[]FINAL

# ==================== 设置分组标志位 ====================

# 1. 核心通用策略组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔄 故障转移`[]⚖️ 负载均衡`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇰🇷 韩国自动`[]🇺🇸 美国自动`[]🇸🇬 新加坡自动`[]🇹🇼 台湾自动`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🔄 故障转移`fallback`.*`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`http://www.apple.com/library/test/success.html`200,,30

# 2. 地区自动测速分组（保留高频地区）
custom_proxy_group=🇭🇰 香港自动`url-test`(港|HK|Hong Kong|HongKong|HKG)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇯🇵 日本自动`url-test`(日|JP|Japan|Tokyo|NRT)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇰🇷 韩国自动`url-test`(韩|南韩|KR|Korea|Seoul|ICN)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇺🇸 美国自动`url-test`(美|US|United States|America|LAX|SFO)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇸🇬 新加坡自动`url-test`(新|坡|SG|Singapore|SIN)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇹🇼 台湾自动`url-test`(台|TW|Taiwan|Taipei|TPE)`http://www.apple.com/library/test/success.html`200,,30

# 3. 业务服务分流策略组（优化优先级）
custom_proxy_group=🤖 AI服务`select`[]🚀 节点选择`[]🇺🇸 美国自动`[]🇯🇵 日本自动`[]🇸🇬 新加坡自动`[]🇹🇼 台湾自动`[]🇭🇰 香港自动`.*
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择`[]🇺🇸 美国自动`[]🇭🇰 香港自动`[]🇹🇼 台湾自动`.*
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`[]🇸🇬 新加坡自动`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🌐 国内直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🌐 国内直连`[]🚀 节点选择`.*
custom_proxy_group=🌐 国内直连`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
