# 兜底
ruleset=🚀 节点选择,[]FINAL

# ==================== 分组（大幅精简） ====================

# 核心通用组
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🔄 故障转移`[]🇭🇰 香港自动`[]🇯🇵 日本自动`[]🇺🇸 美国自动`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🔄 故障转移`fallback`.*`http://www.apple.com/library/test/success.html`200,,30

# 地区自动组（保留最常用）
custom_proxy_group=🇭🇰 香港自动`url-test`(港|HK|Hong Kong|HKG)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇯🇵 日本自动`url-test`(日|JP|Japan|Tokyo)`http://www.apple.com/library/test/success.html`200,,30
custom_proxy_group=🇺🇸 美国自动`url-test`(美|US|United States|LAX|SFO)`http://www.apple.com/library/test/success.html`200,,30

# 🤖 AI专用自动优选组（核心优化点）
custom_proxy_group=🤖 AI服务`url-test`(美|US|United States|JP|Japan|SG|Singapore|港|HK|Taiwan)`http://www.apple.com/library/test/success.html`200,,30

# 其他业务组（简化）
custom_proxy_group=🎥 奈飞视频`select`[]🚀 节点选择`[]🇺🇸 美国自动`[]🇭🇰 香港自动`.*
custom_proxy_group=📢 谷歌服务`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`[]🇯🇵 日本自动`.*
custom_proxy_group=🌍 国外媒体`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`.*
custom_proxy_group=📲 电报信息`select`[]🚀 节点选择`[]♻️ 自动选择`[]🇭🇰 香港自动`.*
custom_proxy_group=Ⓜ️ 微软服务`select`[]🌐 国内直连`[]🚀 节点选择`.*
custom_proxy_group=🍎 苹果服务`select`[]🌐 国内直连`[]🚀 节点选择`.*
custom_proxy_group=🌐 国内直连`select`[]DIRECT

enable_rule_generator=true
overwrite_original_rules=true
